<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Result</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="content">
        <h1>Quiz Result</h1>
        <p>Congratulations, <span th:text="${game.player.username}"></span>!</p>
        <p>Your final score is: <span th:text="${game.score}"></span> out of 10.</p>
        <a th:href="@{/start}" class="retry-link">Try again</a>
        <a th:href="@{/}" class="home-link">Return to Home</a>
    </div>
</body>
</html>
